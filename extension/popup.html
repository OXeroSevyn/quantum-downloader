<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Downloader</title>
  <style>
    :root {
      --q-bg: #070a12;
      --q-card: #0d1322;
      --q-card-hover: #131c31;
      --q-border: rgba(0, 242, 254, 0.22);
      --q-border-hover: rgba(0, 242, 254, 0.55);
      --q-cyan: #00f2fe;
      --q-blue: #3b82f6;
      --q-purple: #a855f7;
      --q-green: #10b981;
      --q-text-main: #f8fafc;
      --q-text-sub: #94a3b8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 370px;
      min-height: 440px;
      background: var(--q-bg);
      color: var(--q-text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 14px 16px 16px 16px;
      overflow-x: hidden;
      user-select: none;
    }

    /* Top Bar */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 12px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .brand-icon {
      font-size: 16px;
      background: linear-gradient(135deg, #00f2fe, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 6px rgba(0, 242, 254, 0.5));
    }

    .brand-name {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 6px #ef4444;
    }

    .status-dot.online {
      background: var(--q-green);
      box-shadow: 0 0 8px var(--q-green);
    }

    /* Active Video Banner */
    .active-card {
      background: var(--q-card);
      border: 1px solid var(--q-border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .active-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .active-tag {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--q-cyan);
    }

    .refresh-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--q-text-sub);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .refresh-btn:hover {
      background: rgba(0, 242, 254, 0.15);
      border-color: rgba(0, 242, 254, 0.4);
      color: #ffffff;
    }

    .active-title {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      color: #ffffff;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .active-url {
      font-size: 11px;
      color: #64748b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Section Title */
    .section-title {
      font-size: 11px;
      font-weight: 800;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Media List */
    .media-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      max-height: 250px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .media-list::-webkit-scrollbar {
      width: 4px;
    }
    .media-list::-webkit-scrollbar-thumb {
      background: rgba(0, 242, 254, 0.3);
      border-radius: 4px;
    }

    .media-item {
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 10px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .media-item:hover {
      background: var(--q-card-hover);
      border-color: var(--q-border-hover);
      transform: translateX(2px);
    }

    .media-info {
      min-width: 0;
      flex: 1;
    }

    .media-res-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .media-quality {
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
    }

    .media-badge {
      font-size: 9px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 4px;
      background: linear-gradient(135deg, #00f2fe, #3b82f6);
      color: #070a12;
    }

    .media-badge.badge-audio {
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: #ffffff;
    }

    .media-meta {
      font-size: 10px;
      color: var(--q-text-sub);
      font-family: monospace;
    }

    .btn-dl {
      background: linear-gradient(135deg, #00f2fe, #3b82f6);
      color: #070a12;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-dl:hover {
      filter: brightness(1.2);
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.6);
      transform: translateY(-1px);
    }

    .btn-dl.btn-dl-audio {
      background: linear-gradient(135deg, #a855f7, #9333ea);
      color: #ffffff;
    }

    .btn-dl.btn-dl-audio:hover {
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.6);
    }

    .empty-msg {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      padding: 30px 10px;
    }

    .loading-spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(0, 242, 254, 0.2);
      border-top-color: var(--q-cyan);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 8px auto;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Footer */
    .footer {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #64748b;
    }

    .footer-highlight {
      color: var(--q-cyan);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand-row">
      <span class="brand-icon">⚡</span>
      <span class="brand-name">Quantum Downloader</span>
    </div>
    <div class="status-badge">
      <span id="status-dot" class="status-dot"></span>
      <span id="status-text">Connecting...</span>
    </div>
  </div>

  <div class="active-card" id="active-card">
    <div class="active-card-top">
      <div class="active-tag">
        <span>●</span>
        <span id="active-tag-text">Active Tab</span>
      </div>
      <button class="refresh-btn" id="refresh-btn" title="Refresh formats">
        <span>🔄</span>
        <span>Refresh</span>
      </button>
    </div>
    <div class="active-title" id="active-title">Detecting active page...</div>
    <div class="active-url" id="active-url">---</div>
  </div>

  <div class="section-title">
    <span>Available Stream Formats</span>
    <span id="format-count" style="color: var(--q-cyan);">0</span>
  </div>

  <div id="media-container" class="media-list">
    <div class="empty-msg">
      <div class="loading-spinner"></div>
      <div>Detecting streams & video formats...</div>
    </div>
  </div>

  <div class="footer">
    <span>Quantum Acceleration</span>
    <span class="footer-highlight">16 Multi-Threads</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
